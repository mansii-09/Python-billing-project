{% extends "adminpanel/base.html" %}

{% block content %}

<div class="form-container">

<div class="form-header">
<h2>Add Invoice</h2>

<a href="{% url 'invoices' %}" class="back-btn">
<i class="fa-solid fa-arrow-left"></i> Back
</a>

</div>

<form method="POST">

{% csrf_token %}

<div class="form-grid">

<div class="form-group">
<label>Organisation</label>

<select name="company">

{% for org in orgs %}
<option value="{{ org.id }}">{{ org.company_name }}</option>
{% endfor %}

</select>

</div>


<div class="form-group">
<label>Customer</label>

<select name="customer">

{% for c in customers %}
<option value="{{ c.id }}">{{ c.cust_name }}</option>
{% endfor %}

</select>

</div>


<div class="form-group">
<label>Invoice Type</label>

<select name="invoice_type">

<option value="Tax Invoice">Tax Invoice</option>
<option value="Retail Invoice">Retail Invoice</option>
<option value="Proforma Invoice">Proforma Invoice</option>

</select>

</div>


<div class="form-group">
<label>Invoice Number</label>
<input type="text" name="invoice_num">
</div>


<div class="form-group">
<label>Date</label>
<input type="date" name="date">
</div>


<div class="form-group">
<label>Due Date</label>
<input type="date" name="due_date">
</div>


<div class="form-group">
<label>Dispatch Through</label>
<input type="text" name="dispatch">
</div>


<div class="form-group">
<label>Bank</label>
<input type="text" name="bank">
</div>


<div class="form-group">
<label>Payment Type</label>
<input type="text" name="payment_type">
</div>


<div class="form-group">
<label>Payment Note</label>
<input type="text" name="payment_note">
</div>


<div class="form-group">
<label>Terms & Conditions</label>
<textarea name="terms"></textarea>
</div>


<div class="form-group">
<label>Document Note</label>
<textarea name="doc_note"></textarea>
</div>

</div>


<div class="form-actions">

<button type="submit" class="save-btn">
<i class="fa-solid fa-floppy-disk"></i> Save Invoice
</button>

</div>

</form>

</div>

{% endblock %}
