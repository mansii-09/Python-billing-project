{% extends "adminpanel/base.html" %}

{% block content %}

<div class="form-container">

<h2>Add Product</h2>

<form method="POST">
    {% csrf_token %}

    <div class="form-grid">

        <div class="form-group">
            <label>Organisation</label>
            <select name="company">
                {% for org in orgs %}
                <option value="{{ org.id }}">{{ org.company_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select name="category" required>
                {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="product_name" required>
        </div>

        <div class="form-group">
            <label>HSN Code</label>
            <input type="text" name="hsn">
        </div>

        <div class="form-group">
            <label>Price</label>
            <input type="number" step="0.01" name="price" required>
        </div>

        <div class="form-group">
            <label>Stock</label>
            <input type="number" name="stock" value="0">
        </div>

        <div class="form-group">
            <label>Discount (%)</label>
            <input type="number" name="discount" value="0">
        </div>

        <div class="form-group">
            <label>CGST (%)</label>
            <input type="number" name="cgst" value="0">
        </div>

        <div class="form-group">
            <label>SGST (%)</label>
            <input type="number" name="sgst" value="0">
        </div>

        <div class="form-group">
            <label>IGST (%)</label>
            <input type="number" name="igst" value="0">
        </div>

        <div class="form-group">
            <label>Cess (%)</label>
            <input type="number" name="cess" value="0">
        </div>

    </div>

    <button class="save-btn">Save Product</button>

</form>

</div>

{% endblock %}
