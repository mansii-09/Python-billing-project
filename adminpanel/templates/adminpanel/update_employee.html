{% extends "adminpanel/base.html" %}

{% block content %}

<div class="form-container">

<div class="form-header">

<h2>Update Employee</h2>

<a href="{% url 'employees' %}" class="back-btn">
<i class="fa-solid fa-arrow-left"></i> Back
</a>

</div>

<form method="POST">

{% csrf_token %}

<div class="form-grid">

<!-- Organisation -->

<div class="form-group">
<label>Organisation</label>

<select name="company">

{% for org in orgs %}

<option value="{{ org.id }}"
{% if org.id == employee.companyName.id %}selected{% endif %}
>
{{ org.company_name }}
</option>

{% endfor %}

</select>

</div>


<!-- Name -->

<div class="form-group">
<label>Name</label>
<input type="text" name="name" value="{{ employee.name }}">
</div>


<!-- Email -->

<div class="form-group">
<label>Email</label>
<input type="email" name="email" value="{{ employee.email }}">
</div>


<!-- Phone -->

<div class="form-group">
<label>Phone</label>
<input type="text" name="phone" value="{{ employee.phone }}">
</div>


<!-- Role -->

<div class="form-group">
<label>Role</label>
<input type="text" name="role" value="{{ employee.role }}">
</div>


<!-- Salary -->

<div class="form-group">
<label>Salary</label>
<input type="number" name="salary" value="{{ employee.salary }}">
</div>


<!-- Joining Date -->

<div class="form-group">
<label>Joining Date</label>
<input type="date" name="joining_date" value="{{ employee.joining_date|date:'Y-m-d' }}">
</div>

</div>


<div class="form-actions">

<button type="submit" class="save-btn">
<i class="fa-solid fa-pen"></i> Update Employee
</button>

</div>

</form>

</div>

{% endblock %}
