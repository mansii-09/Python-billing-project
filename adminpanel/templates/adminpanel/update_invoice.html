{% extends "adminpanel/base.html" %}

{% block content %}

<div class="form-container">

<div class="form-header">
<h2>Update Invoice</h2>

<a href="{% url 'invoices' %}" class="back-btn">
<i class="fa-solid fa-arrow-left"></i> Back
</a>

</div>

<form method="POST">

{% csrf_token %}

<div class="form-grid">

<!-- Organisation -->

<div class="form-group">
<label>Organisation</label>

<select name="company">
{% for org in orgs %}
<option value="{{ org.id }}"
{% if org.id == invoice.companyName.id %}selected{% endif %}
>
{{ org.company_name }}
</option>
{% endfor %}
</select>

</div>


<!-- Customer -->

<div class="form-group">
<label>Customer</label>

<select name="customer">
{% for cust in customers %}
<option value="{{ cust.id }}"
{% if cust.id == invoice.Cust_name.id %}selected{% endif %}
>
{{ cust.cust_name }}
</option>
{% endfor %}
</select>
</div>


<!-- Invoice Type -->

<div class="form-group">
<label>Invoice Type</label>

<select name="invoice_type">

<option value="Tax Invoice"
{% if invoice.Invoice_type == "Tax Invoice" %}selected{% endif %}>
Tax Invoice
</option>

<option value="Retail Invoice"
{% if invoice.Invoice_type == "Retail Invoice" %}selected{% endif %}>
Retail Invoice
</option>

<option value="Proforma Invoice"
{% if invoice.Invoice_type == "Proforma Invoice" %}selected{% endif %}>
Proforma Invoice
</option>

</select>
</div>


<!-- Invoice Number -->

<div class="form-group">
<label>Invoice Number</label>
<input type="text" name="invoice_num" value="{{ invoice.Invoice_num }}">
</div>


<!-- Date -->

<div class="form-group">
<label>Date</label>
<input type="date" name="date" value="{{ invoice.Date|date:'Y-m-d' }}">
</div>


<!-- Due Date -->

<div class="form-group">
<label>Due Date</label>
<input type="date" name="due_date" value="{{ invoice.Due_date|date:'Y-m-d' }}">
</div>


<!-- Dispatch -->

<div class="form-group">
<label>Dispatch Through</label>
<input type="text" name="dispatch" value="{{ invoice.Dispatch_through }}">
</div>


<!-- Bank -->

<div class="form-group">
<label>Bank</label>
<input type="text" name="bank" value="{{ invoice.Bank }}">
</div>


<!-- Payment Type -->

<div class="form-group">
<label>Payment Type</label>
<input type="text" name="payment_type" value="{{ invoice.Payment_type }}">
</div>


<!-- Payment Note -->

<div class="form-group">
<label>Payment Note</label>
<input type="text" name="payment_note" value="{{ invoice.Payment_note }}">
</div>


<!-- Terms -->

<div class="form-group">
<label>Terms & Conditions</label>
<textarea name="terms">{{ invoice.T_c }}</textarea>
</div>


<!-- Document Note -->

<div class="form-group">
<label>Document Note</label>
<textarea name="doc_note">{{ invoice.Document_note }}</textarea>
</div>

</div>


<div class="form-actions">

<button type="submit" class="save-btn">
<i class="fa-solid fa-pen"></i> Update Invoice
</button>

</div>

</form>

</div>

{% endblock %}
