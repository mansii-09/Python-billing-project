{% extends "adminpanel/base.html" %}

{% block content %}

<div class="form-container">

<div class="form-header">

<h2>Update Organisation</h2>

<a href="{% url 'organisations' %}" class="back-btn">
<i class="fa-solid fa-arrow-left"></i> Back
</a>

</div>


<form method="POST">

{% csrf_token %}

<div class="form-grid">

<div class="form-group">
<label>Company Name</label>
<input type="text" name="company_name" value="{{ org.company_name }}">
</div>

<div class="form-group">
<label>Company Type</label>
<input type="text" name="company_type" value="{{ org.company_type }}">
</div>

<div class="form-group">
<label>PAN Number</label>
<input type="text" name="pan_number" value="{{ org.pan_number }}">
</div>

<div class="form-group">
<label>GSTIN Number</label>
<input type="text" name="gstin_number" value="{{ org.gstin_number }}">
</div>

<div class="form-group">
<label>Address Line 1</label>
<input type="text" name="address_1" value="{{ org.address_1 }}">
</div>

<div class="form-group">
<label>Address Line 2</label>
<input type="text" name="address_2" value="{{ org.address_2 }}">
</div>

<div class="form-group">
<label>State</label>
<input type="text" name="state" value="{{ org.state }}">
</div>

<div class="form-group">
<label>City</label>
<input type="text" name="city" value="{{ org.city }}">
</div>

<div class="form-group">
<label>Pincode</label>
<input type="text" name="pincode" value="{{ org.pincode }}">
</div>

<div class="form-group">
<label>Owner Name</label>
<input type="text" name="full_name" value="{{ org.full_name }}">
</div>

<div class="form-group">
<label>Phone</label>
<input type="text" name="phone" value="{{ org.phone }}">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" value="{{ org.email }}">
</div>

</div>


<div class="form-actions">

<button type="submit" class="save-btn">
<i class="fa-solid fa-pen"></i> Update Organisation
</button>

</div>

</form>

</div>

{% endblock %}
