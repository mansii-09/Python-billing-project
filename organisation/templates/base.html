{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Billing Pro</title>
{% load static %}

<link rel="icon" type="image/x-icon" href="{% static 'assets/img/favicon.ico' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">



<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">

</head>

<body>


<div class="layout">

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="sidebar-logo">

        <div class="logo-icon">
            <i class="fa fa-layer-group"></i>
        </div>

        <div class="logo-text">
            <span class="logo-main">Billing</span>
            <span class="logo-accent">Pro</span>
        </div>

    </div>

        <ul class="menu">

            <li>
                <a href="{% url 'index' %}">
                    <i class="fa fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li>
                <a href="{% url 'customer' %}">
                    <i class="fa fa-users"></i>
                    <span>Customers</span>
                </a>
            </li>

            <li>
                <a href="{% url 'invoiceview' %}">
                    <i class="fa fa-file-invoice"></i>
                    <span>Invoices</span>
                </a>
            </li>

            <li>
                <a href="{% url 'category_list' %}">
                    <i class="fa fa-tags"></i>
                    <span>Category</span>
                 </a>
            </li>

            

            <li>
                <a href="{% url 'product_list' %}">
                    <i class="fa fa-box"></i>
                    <span>Products</span>
                </a>
            </li>
            <li>
                <a href="{% url 'employees' %}">
                    <i class="fa fa-user-tie"></i>
                    <span>Employees</span>
                </a>
            </li>

            <li>
                <a href="{% url 'reports' %}">
                     <i class="fa fa-chart-line"></i>
                    <span>Reports</span>
                </a>
            </li>

            <li>
                <a href="{% url 'settings' %}">
                    <i class="fa fa-cog"></i>
                    <span>Settings</span>
                </a>
            </li>

        </ul>

        <div class="sidebar-bottom">


          <a href="{% url 'logout' %}" class="logout-btn">

              <i class="fa fa-sign-out-alt"></i>

              <span>Logout</span>

          </a>

        </div>

    </div>


    <!-- Main Content -->
    <div class="main-content">

        {% block content %}
        {% endblock %}

    </div>

</div>

{% if messages %}
<div id="toast-container">
    {% for message in messages %}
    <div class="toast-msg {{ message.tags }}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}


<script>

setTimeout(function(){

let toast = document.querySelector(".toast-msg");

if(toast){
    toast.classList.add("hide");

    setTimeout(()=>{
        toast.remove();
    },500);
}

},3000);

</script>

</body>
</html>
