<!DOCTYPE html>
<html>

<body style="font-family:Arial;background:#f5f6ff;padding:30px">

<div style="
max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
">

<h2 style="color:#6a5cff">Payment Request</h2>

<p>Hello {{ customer.cust_name }},</p>

<p>You can complete your payment using the link or QR code below.</p>

<a href="{{ qr.payment_link }}" style="
display:inline-block;
margin:15px;
background:#6a5cff;
color:white;
padding:12px 20px;
border-radius:6px;
text-decoration:none;
font-weight:600;
">

Pay Now

</a>

<div style="margin-top:20px">

<img src="cid:qr_code" width="170">

</div>

<p style="margin-top:20px;font-size:12px;color:#888">

Scan the QR code or click the button to complete payment.

</p>

</div>

</body>

</html>
