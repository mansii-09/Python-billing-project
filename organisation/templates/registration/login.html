{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Billing Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:#f5f7fb;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}
.login-container{
width:420px;
background:white;
padding:45px;
border-radius:18px;
box-shadow:0 15px 50px rgba(0,0,0,0.08),0 3px 8px rgba(0,0,0,0.05);
text-align:center;
}
.logo-circle{
width:70px;height:70px;
background:linear-gradient(135deg,#6366f1,#8b5cf6);
border-radius:16px;
display:flex;align-items:center;justify-content:center;
margin:auto;margin-bottom:15px;
color:white;font-size:28px;
box-shadow:0 10px 25px rgba(99,102,241,0.3);
}
.login-title{font-size:26px;font-weight:600;margin-bottom:6px;}
.subtitle{color:#6b7280;font-size:14px;margin-bottom:25px;}
*{box-sizing:border-box;}
.form-group{position:relative;margin-bottom:18px;width:100%;}
.form-group input{
width:100%;
padding:11px 38px 11px 12px;
border-radius:10px;border:1px solid #e5e7eb;font-size:14px;
transition:.2s;box-sizing:border-box;
}
.form-group input:focus{
border-color:#6366f1;
box-shadow:0 0 0 2px rgba(99,102,241,0.15);
outline:none;
}
.form-group i{
position:absolute;right:12px;top:50%;
transform:translateY(-50%);
color:#9ca3af;pointer-events:none;
}
.login-btn{
width:100%;padding:12px;border:none;border-radius:10px;
background:linear-gradient(135deg,#6366f1,#8b5cf6);
color:white;font-size:15px;font-weight:500;
cursor:pointer;transition:.25s;margin-top:5px;
}
.login-btn:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(0,0,0,0.15);
}
.register{margin-top:18px;font-size:14px;color:#6b7280;}
.register a{color:#6366f1;font-weight:500;text-decoration:none;}
.register a:hover{text-decoration:underline;}
.alert{
background:#fee2e2;color:#b91c1c;
padding:10px;border-radius:8px;margin-bottom:15px;font-size:13px;
}
</style>
</head>
<body>
<div class="login-container">
<div class="logo-circle">
<i class="fa fa-layer-group"></i>
</div>
<div class="login-title">Billing Pro</div>
<div class="subtitle">Login to manage your invoices</div>

{% if error %}
<div class="alert">{{ error }}</div>
{% endif %}

<form method="POST">
{% csrf_token %}
<div class="form-group">
<input type="text" id="loginField" name="email" placeholder="Email Address" required>
<i class="fa fa-envelope"></i>
</div>
<div class="form-group">
<input type="password" name="password" placeholder="Password" required>
<i class="fa fa-lock"></i>
</div>

<div style="display:flex;align-items:center;gap:8px;margin:10px 0 5px 0;justify-content:left;">
<input type="checkbox" name="admin_login" id="admin_login">
<label for="admin_login" style="font-size:14px;color:#6b7280;cursor:pointer;">Login as Admin</label>
</div>

<button type="submit" class="login-btn">Login</button>
</form>

<div class="register">
Don't have an account? <a href="{% url 'signup' %}">Register</a>
</div>
</div>

<script>
const checkbox = document.getElementById("admin_login");
const input = document.getElementById("loginField");
checkbox.addEventListener("change", function(){
    if(this.checked){ input.placeholder = "Admin Username"; }
    else{ input.placeholder = "Email Address"; }
});
</script>
</body>
</html>
