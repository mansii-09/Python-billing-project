{% extends "base.html" %}
{% block content %}

<div class="dashboard-wrapper">

<div class="page-header">
<h1>Share Payment QR</h1>
<p>Select customers to send payment email</p>
</div>

<div class="card-box">

<!-- QR Preview -->
<div class="qr-preview">

<img src="{{ qr.qr_image.url }}">

</div>

<form method="POST">

{% csrf_token %}

<!-- Select All -->
<label class="select-all">

<input type="checkbox" id="selectAll">

Select All Customers

</label>

<!-- Customer List -->
<div class="customer-list">

{% for c in customers %}

<label class="customer-item">

<input type="checkbox" name="customers" value="{{ c.id }}" class="customer-checkbox">

<div class="cust-info">
<strong>{{ c.cust_name }}</strong>
<span>{{ c.email }}</span>
</div>

</label>

{% endfor %}

</div>

<button class="primary-btn">
<i class="fa fa-envelope"></i>
Send Payment Email
</button>

</form>

</div>

</div>


<style>

.page-header{
margin-bottom:20px;
}

.page-header p{
color:#777;
}

.card-box{
background:white;
padding:30px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,0.05);
max-width:650px;
}

.qr-preview{
text-align:center;
margin-bottom:20px;
}

.qr-preview img{
width:160px;
border-radius:10px;
padding:8px;
background:#f4f6ff;
}

.select-all{
display:block;
margin-bottom:15px;
font-weight:500;
}

.customer-list{
max-height:300px;
overflow-y:auto;
margin-bottom:20px;
}

.customer-item{
display:flex;
align-items:center;
gap:12px;
padding:12px;
border:1px solid #eee;
border-radius:8px;
margin-bottom:10px;
cursor:pointer;
}

.customer-item:hover{
background:#f8f9ff;
}

.cust-info span{
display:block;
font-size:12px;
color:#888;
}

.primary-btn{
background:linear-gradient(135deg,#6a5cff,#8a7bff);
color:white;
padding:10px 20px;
border:none;
border-radius:8px;
font-weight:500;
cursor:pointer;
}

</style>


<script>

/* Select All Customers */

document.getElementById("selectAll").addEventListener("change", function(){

let checkboxes = document.querySelectorAll(".customer-checkbox");

checkboxes.forEach(function(box){

box.checked = document.getElementById("selectAll").checked;

});

});

</script>


{% endblock %}
